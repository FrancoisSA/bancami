{% extends "base.html" %}

{% block content %}
<div class="container mx-auto px-4 py-8">
  <h1 class="text-2xl font-bold mb-6">Tableau de bord budgétaire</h1>

  <div class="bg-white shadow rounded-lg p-6">
    <div class="flex justify-between items-center mb-4">
      <h2 class="text-lg font-semibold">Transactions</h2>
      <span id="transactionCount" class="text-gray-500">Chargement...</span>
    </div>

    <div id="transactionsContainer">
      <p class="text-gray-500 py-4 text-center">Chargement des transactions...</p>
    </div>
  </div>
</div>

<script>
// Charger les transactions
async function loadTransactions() {
  try {
    const response = await fetch('/api/transactions');
    if (!response.ok) throw new Error('Failed to load');
    
    const transactions = await response.json();
    const container = document.getElementById('transactionsContainer');
    
    if (transactions.length === 0) {
      container.innerHTML = '<p class="text-gray-500 py-4 text-center">Aucune transaction.</p>';
      return;
    }

    // Créer le tableau
    let html = `
      <div class="overflow-x-auto">
        <table class="w-full">
          <thead>
            <tr class="text-left text-gray-600 border-b">
              <th class="pb-2">Date</th>
              <th class="pb-2">Libellé</th>
              <th class="pb-2">Montant</th>
              <th class="pb-2">Catégorie</th>
              <th class="pb-2">Actions</th>
            </tr>
          </thead>
          <tbody>
    `;

    transactions.forEach(tx => {
      html += `
        <tr class="border-b hover:bg-gray-50">
          <td class="py-3">${tx.date}</td>
          <td class="py-3">${tx.label}</td>
          <td class="py-3 ${tx.type === 'credit' ? 'text-green-600' : 'text-red-600'}">
            ${tx.type === 'credit' ? '+' : '-'}${tx.amount.toFixed(2)}€
          </td>
          <td class="py-3">${tx.category}</td>
          <td class="py-3 text-center">
            <button 
              onclick="deleteTransaction('${tx.transaction_id}')"
              class="text-red-500 hover:text-red-700"
              title="Supprimer"
            >
              🗑️
            </button>
          </td>
        </tr>
      `;
    });

    html += `
          </tbody>
        </table>
      </div>
    `;
    
    container.innerHTML = html;
    document.getElementById('transactionCount').textContent = 
      `${transactions.length} transaction(s)`;
    
  } catch (error) {
    document.getElementById('transactionsContainer').innerHTML = 
      `<p class="text-red-500 py-4 text-center">Erreur: ${error.message}</p>`;
  }
}

// Supprimer une transaction
async function deleteTransaction(transactionId) {
  if (!confirm('Voulez-vous vraiment supprimer cette transaction ?')) {
    return;
  }
  
  try {
    const response = await fetch(`/api/transactions/${transactionId}`, {
      method: 'DELETE'
    });
    
    if (response.ok) {
      alert('Transaction supprimée avec succès !');
      loadTransactions(); // Recharger la liste
    } else {
      const result = await response.json();
      alert(`Erreur: ${result.error || 'Impossible de supprimer'}`);
    }
  } catch (error) {
    alert('Erreur réseau: ' + error.message);
  }
}

// Charger les transactions au démarrage
document.addEventListener('DOMContentLoaded', loadTransactions);
</script>
{% endblock %}
